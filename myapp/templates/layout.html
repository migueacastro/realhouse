<!DOCTYPE html>

<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- http://getbootstrap.com/docs/5.1/ -->

        <script src="https://kit.fontawesome.com/9a6b5f9ec8.js" crossorigin="anonymous"></script>
        <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" rel="stylesheet">
        <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"></script>

        <!--Favicon here-->
        <link href="/static/logo.ico" rel="icon">

        <link href="/static/styles.css" rel="stylesheet">
        <title>Home</title>
    </head>

    <body style="background-color: var(--color-primary);">
        <header class style="position: fixed; top: 0; width: 100%; box-shadow:  5px 5px 10px 2px rgba(0, 0, 0, 0.25)">


            <nav>

                <a href="/"><img src="static/logo.svg" alt="RealHouse" class="logo"></a>
                <a href="/" class="a logo-font">
                    <div class="logo-title">RealHouse</div>
                </a>

                <ul>
                    <li><a class="nav-item" href="/marketplace">Marketplace</a></li>
                    <li><a class="nav-item" href="/about">About</a></li>
                    {% if session["user_id"] %}
                        <li><a class="nav-item" href="/logout">Log Out<i class="fa-solid fa-right-from-bracket" style="margin-left:10px;"></i></a></li>
                        <li><a class="nav-item" href="/account">{{ session["username"] }}<i class="fa-solid fa-user" style="margin-left:10px;"></i></a></li>

                    {% else %}
                        <li style="display: flex; text-align: center;"><a class="btn btn-1" href="/login">Log In</a></li>
                    {% endif %}
                </ul>

                {% if not session["user_id"] %}
                    <a class="btn btn-2" href="/signup">Sign Up</a>
                {% endif %}
                <a class="hamburger" onclick="navBarFunction"><i class="fa fa-bars"></i></a>
            </nav>


        </header>

        <script>
            hamburger = document.querySelector(".hamburger");
            hamburger.onclick = function() {
                navBar = document.querySelector("nav ul");
                navBar.classList.toggle("active");
                headBar = document.querySelector("header");
                headBar.classList.toggle("active")
            }
        </script>
        <main class="">
            {% block main %}{% endblock %}
        </main>
        <footer>
            <div class="logo-container">
                <img src="static/logo.svg" alt="RealHouse" class="logo logofooter">
                <div class="logo-title">RealHouse</div>
            </div>
            <div class="logo-container">
                <a class="github-icon" href="#"><i class="fa-brands fa-github"></i></a>
                <h3>migueacastro</h3>
            </div>
            <div class="logo-container">
                <h6>Made by Miguel Castro (2023)</h6>
            </div>
        </footer>
    </body>

</html>
