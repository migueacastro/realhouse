{% extends "layout.html" %}

{% block main %}

    <div class="vh-100 bg-overlay logregsec">
        <div class="py-5 text-center querysection rounded">
            <h1 class="mb-5" style="margin-top: 150px;">Sign Up</h1>

            <form action="/signup" method="post">
                <div class="w-75 mx-auto">
                    <input autofocus class="form-control mb-2 rounded" name="username" placeholder="Username" type="text" required>
                    <input autofocus class="form-control mb-2 rounded" name="email" placeholder="Email" type="email">
                    <input autofocus class="form-control mb-2 rounded" name="phone" placeholder="Phone Number" type="number" required>
                    <input autocomplete="off" autofocus class="form-control mb-2 rounded" name="password" placeholder="Password" type="password" required pattern="(?=.*\d)(?=.*[a-z])(?=[A-Z]).{8,}" id="password">

                    <input autocomplete="off" autofocus class="form-control mb-2 rounded" name="rpassword" placeholder="Repeat Password" type="password" required>
                    <button type="submit" class="btn btn-3 mx-auto">Sign Up</button><br>
                    <label>Already have an account? <a href="/login">Log In Here</a> </label>
                </div>
            </form>
            <div id="message">
                <h3 style="text-align: center !important; font-weight: bold;">Password must contain the following:</h3>
                <div class="mx-auto">
                    <p id="letter" class="invalid">A <b>lowercase</b> letter</p>
                    <p id="capital" class="invalid">A <b>capital (uppercase)</b> letter</p>
                    <p id="number" class="invalid">A <b>number</b></p>
                    <p id="length" class="invalid">Minimum <b>8 characters</b></p>
                </div>

            </div>
        </div>
    </div>

    <script>
        var myInput = document.getElementById("password");
        var letter = document.getElementById("letter");
        var capital = document.getElementById("capital");
        var number = document.getElementById("number");
        var length = document.getElementById("length");

    // Show when password field is clicked

        myInput.onfocus = function() {
            document.getElementById("message").style.display = "flex";
        }

    // Hide message box when user clicks outside the password field
        myInput.onblur = function() {
            document.getElementById("message").style.display = "none";
        }

    // When the user starts to type inside the field
        myInput.onkeyup = function() {
        // Validate lowercase letters
            var lowerCaseLetters = /[a-z]/g;
            if (myInput.value.match(lowerCaseLetters)) {
                letter.classList.remove("invalid");
                letter.classList.add("valid");
            } else {
                letter.classList.remove("valid");
                letter.classList.add("valid");
            }

        // Validate Uppercase Letters
            var upperCaseLetters = /[A-Z]/g;
            if (myInput.value.match(upperCaseLetters)) {
                capital.classList.remove("invalid");
                capital.classList.add("valid");
            } else {
                capital.classList.remove("valid")
                capital.classList.add("invalid")
            }

        // Validate Numbers
            var numberChars = /[0-9]/g;
            if (myInput.value.match(numberChars)) {
                number.classList.remove("invalid");
                number.classList.add("valid");
            } else {
                number.classList.remove("valid")
                number.classList.add("invalid")
            }

        // Validate lenght
            if (myInput.value.length >= 8) {
                length.classList.remove("invalid");
                length.classList.add("valid");
            } else {
                length.classList.remove("valid")
                length.classList.add("invalid")
            }
        }
    </script>

{% endblock %}
